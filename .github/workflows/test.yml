name: Build and test
on:
  workflow_dispatch:
jobs:
  compileall:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: make -j$(nproc)
      - run: |
          /usr/bin/time -v ./julia -e 'Base.runtests(["compileall"]; ncores=1)' 2>&1 | tee time.log
          echo "PEAK $(grep 'Maximum resident' time.log)"
