name: Build and test
on:
  pull_request:
  push: { branches: [master] }
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 6
      JULIA_CPU_TARGET: 'generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The release targets: precompile.jl needs several, and math.jl expects FMA in Base when the CPU has it.
      - id: build
        run: make -j$(nproc) JULIA_CPU_TARGET="$JULIA_CPU_TARGET"
      # The runner's resolver fails reverse lookups that Sockets' getnameinfo test expects to succeed.
      - run: echo '255.255.255.0 netmask' | sudo tee -a /etc/hosts
      # rr refuses to record at the runner's default perf_event_paranoid of 4.
      - run: sudo sysctl kernel.perf_event_paranoid=1
      # threads.jl runs in its own step: its BLAS test needs JULIA_CPU_THREADS to cover every CPU.
      - name: Choose tests
        run: |
          # Pkg's tests pin versions of OrderedCollections, which is vendored here as a stdlib.
          tests="all -compileall -threads -Pkg"
          if [ "${{ github.event_name }}" = pull_request ] && git diff --quiet HEAD^1 HEAD -- Compiler src base/compiler test/compiler; then
            tests="$tests -compiler"
          fi
          echo "TESTS=$tests" >> "$GITHUB_ENV"
      - run: |
          (while true; do echo "MEM $(date +%T) $(free -m | awk '/Mem:/ {print $3 "/" $2 " MB used, " $7 " MB available"}') load=$(cut -d' ' -f1 /proc/loadavg)"; sleep 60; done) &
          ./julia -e '
            include(joinpath(Sys.BINDIR, Base.DATAROOTDIR, "julia", "test", "choosetests.jl"))
            shard = choosetests(split(ENV["TESTS"])).tests[parse(Int, ENV["SHARD"]):parse(Int, ENV["SHARDS"]):end]
            println("Shard ", ENV["SHARD"], ": ", join(shard, " "))
            Base.runtests(shard; ncores=2)'
        env:
          JULIA_TEST_VERBOSE_LOGS_DIR: ${{ runner.temp }}
          JULIA_TEST_MAXRSS_MB: 3500
      - if: ${{ !cancelled() && matrix.shard == 1 }}
        run: ./julia -e 'Base.runtests(["threads"]; ncores=Sys.EFFECTIVE_CPU_THREADS)'
      # One zstd archive per master push or manual run, built even when tests fail; its sysimage is the downloadable build.
      - if: ${{ !cancelled() && matrix.shard == 1 && github.event_name != 'pull_request' && steps.build.conclusion == 'success' }}
        run: |
          make -j$(nproc) binary-dist JULIA_CPU_TARGET="$JULIA_CPU_TARGET"
          tar --use-compress-program='zstd -T0 -10' -cf "julia-$GITHUB_SHA-linux-x86_64.tar.zst" julia-*/
      - if: ${{ !cancelled() && matrix.shard == 1 && github.event_name != 'pull_request' && steps.build.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: julia-${{ github.sha }}-linux-x86_64
          path: julia-*.tar.zst
          compression-level: 0
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
  compileall:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Choose whether to run
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ] && git diff --quiet HEAD^1 HEAD -- Compiler src base/compiler test/compileall.jl; then
            run=false
          fi
          echo "RUN=$run" >> "$GITHUB_ENV"
      - if: env.RUN == 'true'
        run: make -j$(nproc)
      - if: env.RUN == 'true'
        run: ./julia -e 'Base.runtests(["compileall"]; ncores=1)'
