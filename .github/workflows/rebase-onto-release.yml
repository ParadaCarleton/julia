name: Rebase onto latest Julia release
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency: rebase-onto-release
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0, token: "${{ secrets.REBASE_TOKEN }}" }
      - name: Rebase master and its open pull requests onto newest stable tag
        env: { BRANCH: master, GH_TOKEN: "${{ secrets.REBASE_TOKEN }}" }
        run: |
          set -euo pipefail
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git fetch --tags https://github.com/JuliaLang/julia.git
          latest=$(git tag -l 'v*' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD)
          echo "base=$base latest=$latest"
          if [ "$base" = "$latest" ]; then exit 0; fi
          old=$(git rev-parse HEAD)
          git rebase --onto "$latest" "$base"
          new=$(git rev-parse HEAD)
          git push --force-with-lease="$BRANCH:$old" origin "HEAD:$BRANCH"
          # Each pull request keeps only its own commits, the ones after the old master tip.
          stale=()
          for head in $(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --state open --json headRefName,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .headRefName'); do
            tip=$(git rev-parse "origin/$head")
            if git merge-base --is-ancestor "$old" "$tip" && git rebase --onto "$new" "$old" "$tip"; then
              git push --force-with-lease="$head:$tip" origin "HEAD:$head"
            else
              git rebase --abort 2>/dev/null || true
              stale+=("$head")
            fi
          done
          if [ ${#stale[@]} -gt 0 ]; then
            echo "::error::Rebase these pull request branches onto $BRANCH by hand: ${stale[*]}"
            exit 1
          fi
