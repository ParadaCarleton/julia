name: Rebase onto latest Julia release
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push: { branches: [master] }
permissions:
  contents: write
  pull-requests: read
concurrency: rebase-onto-release
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0, token: "${{ secrets.REBASE_TOKEN }}" }
      - if: ${{ github.event_name != 'push' }}
        uses: julia-actions/setup-julia@v2
      - name: Rebase master onto newest stable tag and vendor the stdlibs, then rebase its open pull requests onto master
        env:
          BRANCH: master
          GH_TOKEN: "${{ secrets.REBASE_TOKEN }}"
          FORCED: "${{ github.event.forced }}"
          BEFORE: "${{ github.event.before }}"
          AFTER: "${{ github.event.after }}"
        run: |
          set -euo pipefail
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A forced push to master comes from the release rebase below, which moves the pull requests itself.
            if [ "$FORCED" = true ]; then exit 0; fi
            old=$BEFORE
            new=$AFTER
          else
            git fetch --tags https://github.com/JuliaLang/julia.git
            latest=$(git tag -l 'v*' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD)
            echo "base=$base latest=$latest"
            old=$(git rev-parse HEAD)
            if [ "$base" != "$latest" ]; then git rebase --onto "$latest" "$base"; fi
            julia --startup-file=no contrib/vendor_stdlibs.jl
            git add -A stdlib test/vendored_stdlibs.toml
            if ! git diff --cached --quiet; then git commit -m "stdlib: update vendored packages"; fi
            new=$(git rev-parse HEAD)
            if [ "$new" = "$old" ]; then exit 0; fi
            git push --force-with-lease="$BRANCH:$old" origin "HEAD:$BRANCH"
          fi
          # Each pull request keeps only its own commits, the ones after the old master tip.
          stale=()
          for head in $(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --state open --json headRefName,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .headRefName'); do
            tip=$(git rev-parse "origin/$head")
            if git merge-base --is-ancestor "$new" "$tip"; then continue; fi
            if git merge-base --is-ancestor "$old" "$tip" && git rebase --onto "$new" "$old" "$tip"; then
              git push --force-with-lease="$head:$tip" origin "HEAD:$head"
            else
              git rebase --abort 2>/dev/null || true
              stale+=("$head")
            fi
          done
          if [ ${#stale[@]} -gt 0 ]; then
            echo "::error::Rebase these pull request branches onto $BRANCH by hand: ${stale[*]}"
            exit 1
          fi
